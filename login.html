<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="/Cyklze_ikn.png">
    <link rel="canonical" href="https://cyklze.com/login.html">

    <title>Verify Screen</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.8),
                    rgba(255, 255, 255, 0.8)
                ),
                url("Cyklze_ikn.png");

            background-size: 300% 400%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* FIXED */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .content {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #00796B;
        }

        .label {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 500;
            color: #1D4D61;
        }

        .input-container {
            display: flex;
            align-items: center;
            background-color: #FFF;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .input {
            flex: 1;
            height: 40px;
            font-size: 16px;
            margin-left: 8px;
            padding: 8px;
            border: none;
            outline: none;
        }

        .button {
            background-color: #1D4D61;
            border-radius: 10px;
            padding: 14px;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .button:disabled {
            background-color: #A0B3B6;
            cursor: not-allowed;
        }

        .timer-text {
            font-size: 16px;
            color: #FF0000;
            margin-top: 8px;
        }

        .terms-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
            font-size: 14px;
        }

        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #4caf50;
            color: white;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-family: sans-serif;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.5s ease, bottom 0.5s ease;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        .left-text {
            text-align: left;
            padding-top: 80px;
            padding-left: 5px;
        }

        .link-text {
            color: #00796B;
            text-decoration: underline;
            cursor: pointer;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #00796B;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div id="verifyContent" class="content">

        <div class="left-text">
            <h1 class="title">Login</h1>
            <p class="label" id="labelText">Enter Mobile Number</p>
        </div>

        <!-- Phone Number Section -->
        <div id="phoneNumberSection">

            <div class="input-container">
                <span>+91</span>

                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="Enter phone number"
                    class="input"
                    maxlength="10"
                    autocomplete="tel"
                    pattern="\d{10}"
                    oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10);"
                />
            </div>

            <button id="sendOtpButton" class="button">
                Send OTP
            </button>

        </div>

        <!-- Spinner -->
        <div id="loadingSpinner" class="spinner" style="display:none;"></div>

        <!-- OTP Section -->
        <div id="otpSection" style="display:none;">

            <div class="input-container">

                <input
                    type="tel"
                    id="otp"
                    placeholder="Enter OTP"
                    class="input"
                    maxlength="6"
                    autocomplete="one-time-code"
                    pattern="\d{6}"
                    oninput="this.value = this.value.replace(/\D/g, '').slice(0, 6);"
                />

            </div>

            <button id="verifyOtpButton" class="button">
                Verify OTP
            </button>

            <p id="timerText" class="timer-text"></p>

        </div>

        <!-- Toast -->
        <div id="toast" class="toast">
            OTP sent successfully.
        </div>

        <!-- Terms -->
        <div class="terms-container">

            <span>By continuing, you agree to our </span>

            <!-- FIXED -->
            <a href="Privacy_policy.html" class="link-text">
                Privacy Policy
            </a>

            <span> and </span>

            <!-- FIXED -->
            <a href="Terms_of_Service.html" class="link-text">
                Terms of Service
            </a>

        </div>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const verifyContent = document.getElementById('verifyContent');

    const phoneNumberInput = document.getElementById('phoneNumber');

    const sendOtpButton = document.getElementById('sendOtpButton');

    const otpSection = document.getElementById('otpSection');

    const otpInput = document.getElementById('otp');

    const verifyOtpButton = document.getElementById('verifyOtpButton');

    const timerText = document.getElementById('timerText');

    const loadingSpinner = document.getElementById('loadingSpinner');

    const labelText = document.getElementById('labelText');

    const phoneNumberSection = document.getElementById('phoneNumberSection');

    let cooldown = 120;

    let otpCooldownTimer;

    verifyContent.style.display = 'block';

    // TOAST
    function showToast(message) {

        const toast = document.getElementById("toast");

        toast.textContent = message;

        toast.className = "toast show";

        setTimeout(() => {
            toast.className = toast.className.replace("show", "");
        }, 3000);
    }

    // OTP TIMER
    const startOtpCooldown = () => {

        clearInterval(otpCooldownTimer);

        cooldown = 120;

        phoneNumberSection.style.display = "none";

        otpSection.style.display = "block";

        labelText.textContent = "Enter OTP";

        otpCooldownTimer = setInterval(() => {

            cooldown--;

            timerText.textContent = `Enter OTP within ${cooldown}s`;

            if (cooldown <= 0) {

                clearInterval(otpCooldownTimer);

                phoneNumberSection.style.display = "block";

                otpSection.style.display = "none";

                labelText.textContent = "Enter Mobile Number";

                timerText.textContent = "";

                sendOtpButton.disabled = false;
            }

        }, 1000);
    };

    // SEND OTP
    sendOtpButton.addEventListener('click', async () => {

        const phoneNumber = phoneNumberInput.value;

        // Validation
        if (!/^[0-9]{10}$/.test(phoneNumber)) {

            alert("Please enter a valid 10-digit phone number.");

            return;
        }

        sendOtpButton.disabled = true;

        const originalText = sendOtpButton.innerText;

        sendOtpButton.innerText = "Loading...";

        loadingSpinner.style.display = 'block';

        try {

            const response = await fetch(
                'https://0gb8de1kda.execute-api.us-east-1.amazonaws.com/2order/2order/verify-otp',
                {
                    method: 'PUT',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({ phoneNumber }),
                }
            );

            const responseBody = await response.json();

            console.log('Response Status:', response.status);

            console.log('Response Body:', responseBody);

            if (response.ok) {

                showToast("OTP sent successfully.");

                startOtpCooldown();

            } else {

                alert(`Failed to send OTP: ${responseBody.error || 'Unknown error'}`);

                sendOtpButton.disabled = false;
            }

        } catch (error) {

            console.error('Error sending OTP:', error);

            alert("Error sending OTP.");

            sendOtpButton.disabled = false;

        } finally {

            sendOtpButton.innerText = originalText;

            loadingSpinner.style.display = 'none';
        }
    });

    // VERIFY OTP
    verifyOtpButton.addEventListener('click', async () => {

        const otp = otpInput.value;

        // Validation
        if (otp.length !== 6 || !/^[0-9]{6}$/.test(otp)) {

            alert("OTP must be exactly 6 digits.");

            return;
        }

        verifyOtpButton.disabled = true;

        const originalText = verifyOtpButton.innerText;

        verifyOtpButton.innerText = "Loading...";

        loadingSpinner.style.display = 'block';

        try {

            const response = await fetch(
                'https://0gb8de1kda.execute-api.us-east-1.amazonaws.com/2order/2order/verify-otp',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        phoneNumber: phoneNumberInput.value,
                        otp
                    }),
                }
            );

            if (response.ok) {

                const data = await response.json();

                showToast("OTP Verified successfully.");

                localStorage.setItem('accessToken', data.accessToken);

                localStorage.setItem('refreshToken', data.refreshToken);

                const previousPage = localStorage.getItem("previousPage");

                setTimeout(() => {

                    if (previousPage) {

                        window.location.replace(previousPage);

                    } else {

                        window.location.replace("index.html");
                    }

                }, 1000);

            } else {

                alert("Invalid OTP.");
            }

        } catch (error) {

            console.error(error);

            alert("Error verifying OTP.");

        } finally {

            verifyOtpButton.disabled = false;

            verifyOtpButton.innerText = originalText;

            loadingSpinner.style.display = 'none';
        }
    });

});

</script>

</body>
</html>
