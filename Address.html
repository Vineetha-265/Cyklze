.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;

  display: none; /* or flex when active */
  align-items: center;
  justify-content: center;

  z-index: 99999;
  background: rgba(0,0,0,0.28);
  backdrop-filter: blur(6px);
}

/* Card */
.loading-card {
  background: rgba(255,255,255,0.96);
  padding: 26px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 22px rgba(0,0,0,0.12);
  animation: pop 0.2s ease-in-out;
}

@keyframes pop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* Spinner ring (Flutter-like) */
.spinner-ring {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  border: 6px solid rgba(29,77,97,0.15);
  border-top: 6px solid #1D4D61;
  animation: spin 1.2s linear infinite;
  margin: auto;
  position: relative;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* inner icon */
.inner-icon {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

/* Text */
.loading-text {
  margin-top: 12px;
  font-weight: 600;
  color: #1D4D61;
  font-size: 16px;
}

/* Dots animation */
.dots {
  margin-top: 10px;
  display: flex;
  justify-content: center;
  gap: 6px;
}

.dots span {
  width: 8px;
  height: 8px;
  background: #1D4D61;
  border-radius: 50%;
  animation: bounce 0.9s infinite ease-in-out;
}

.dots span:nth-child(2) { animation-delay: 0.15s; }
.dots span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 100% { transform: translateY(0); opacity: 0.6; }
  50% { transform: translateY(-6px); opacity: 1; }
}

// Cookie helpers
function getCookie(name) {
  const nameEQ = name + "=";
  const ca = document.cookie.split(';');
  for (let i = 0; i < ca.length; i++) {
    let c = ca[i].trim();
    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length);
  }
  return null;
}

let selectedLocality = 'Select Locality';

const localityDropdown = document.getElementById('localityDropdown');
const localityDropdownMenu = document.getElementById('localityDropdownMenu');
const localityList = document.getElementById('localityList');
const localitySearch = document.getElementById('localitySearch');

function populateLocalityDropdown(filter = "") {
  const filtered = Localities.filter(loc =>
    loc.label.toLowerCase().includes(filter.toLowerCase())
  );

  localityList.innerHTML = filtered.map(loc =>
    `<div class="dropdownItem" onclick="selectLocality('${loc.value}')">${loc.label}</div>`
  ).join('');
}

function selectLocality(locality) {
  selectedLocality = locality;
  document.getElementById('selectedLocality').textContent = locality;
  localityDropdownMenu.style.display = 'none';
  localitySearch.value = "";
}

localityDropdown.addEventListener('click', function () {
  const isOpen = localityDropdownMenu.style.display === 'block';
  localityDropdownMenu.style.display = isOpen ? 'none' : 'block';

  if (!isOpen) {
    populateLocalityDropdown();
    localitySearch.focus();
  }
});

localitySearch.addEventListener('input', function () {
  populateLocalityDropdown(this.value);
});

/* ================= CONFIRM ADDRESS ================= */

const confirmAddressButton = document.getElementById('confirmAddressButton');

confirmAddressButton.addEventListener('click', function () {

  const street = document.getElementById('streetAddress').value.trim();
  const area = document.getElementById('colonyArea').value.trim();
  const postal = document.getElementById('postalCode').value.trim();

  if (!street || !area || selectedCity === 'Select City' || selectedLocality === 'Select Locality' || !postal) {
    alert('Please fill all fields.');
    return;
  }

  const pattern = /^5000(0[1-9]|[1-9][0-9])$/;

  if (!pattern.test(postal)) {
    alert("We don't serve this postal code.");
    return;
  }

  const fullAddress = `${street}, ${area}, ${selectedLocality}, ${selectedCity}, ${postal}`;
  localStorage.setItem('address', fullAddress);

  window.location.replace("1confirm.html");
});
