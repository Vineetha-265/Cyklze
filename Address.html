/* ================= TOKEN CHECK FUNCTIONALITY ================= */

function goToLogin() {

  localStorage.setItem("previousPage", window.location.href);

  window.location.replace("login.html");
}

function getCookie(name) {

  const nameEQ = name + "=";

  const ca = document.cookie.split(';');

  for (let i = 0; i < ca.length; i++) {

    let c = ca[i].trim();

    if (c.indexOf(nameEQ) === 0)
      return c.substring(nameEQ.length);
  }

  return null;
}

const isTokenExpired = async () => {

  const accessToken = localStorage.getItem('accessToken');

  if (!accessToken) return true;

  try {

    const response = await fetch(
      'https://0gb8de1kda.execute-api.us-east-1.amazonaws.com/2order/2order/checkTokenExpiration',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: accessToken,
        },
        body: JSON.stringify({ accessToken }),
      }
    );

    if (!response.ok) {

      throw new Error('Failed to check token expiration');

    } else {

      document.getElementById("loading").style.display = "none";

      document.getElementById("error-box").style.display = "none";

      document.getElementById("main-content").style.display = "block";

      document.getElementById("login-box").style.display = "none";
    }

    const responseData = await response.json();

    const nowtoken = responseData.accessToken;

    await localStorage.setItem('accessToken', nowtoken);

    return false;

  } catch (error) {

    console.error('Error checking token expiration:', error);

    document.getElementById("loading").style.display = "none";

    document.getElementById("error-box").style.display = "block";

    document.getElementById("main-content").style.display = "none";

    document.getElementById("login-box").style.display = "none";

    return true;
  }
};

async function checkTokenAndNavigate() {

  const accessToken = localStorage.getItem('accessToken');

  document.getElementById("loading").style.display = "flex";

  document.getElementById("error-box").style.display = "none";

  document.getElementById("main-content").style.display = "none";

  document.getElementById("login-box").style.display = "none";

  if (!accessToken) {

    localStorage.setItem("previousPage", window.location.href);

    document.getElementById("loading").style.display = "none";

    document.getElementById("login-box").style.display = "flex";

    return;
  }

  const isExpired = await isTokenExpired();

  if (isExpired) {

    document.getElementById("loading").style.display = "none";

    document.getElementById("error-box").style.display = "block";

    document.getElementById("main-content").style.display = "none";

    document.getElementById("login-box").style.display = "none";

    localStorage.setItem("previousPage", window.location.href);

  } else {

    document.getElementById("loading").style.display = "none";

    document.getElementById("error-box").style.display = "none";

    document.getElementById("main-content").style.display = "block";

    document.getElementById("login-box").style.display = "none";
  }
}

let selectedLocality = 'Select Locality';

const localityDropdown = document.getElementById('localityDropdown');

const localityDropdownMenu = document.getElementById('localityDropdownMenu');

const localityList = document.getElementById('localityList');

const localitySearch = document.getElementById('localitySearch');

function populateLocalityDropdown(filter = "") {

  const filtered = Localities.filter(loc =>
    loc.label.toLowerCase().includes(filter.toLowerCase())
  );

  localityList.innerHTML = filtered.map(loc =>
    `<div class="dropdownItem" onclick="selectLocality('${loc.value}')">${loc.label}</div>`
  ).join('');
}

function selectLocality(locality) {

  selectedLocality = locality;

  document.getElementById('selectedLocality').textContent = locality;

  localityDropdownMenu.style.display = 'none';

  localitySearch.value = "";
}

localityDropdown.addEventListener('click', function () {

  const isOpen = localityDropdownMenu.style.display === 'block';

  localityDropdownMenu.style.display = isOpen ? 'none' : 'block';

  if (!isOpen) {

    populateLocalityDropdown();

    localitySearch.focus();
  }
});

localitySearch.addEventListener('input', function () {

  populateLocalityDropdown(this.value);
});

function myFunction() {

  const items = localStorage.getItem("items");

  const image = localStorage.getItem("selectedImage");

  const date = localStorage.getItem("selectedDate");

  if (!items || items === "[]" ||
      !image || image === "[]" ||
      !date || date === "[]") {

    window.location.replace("index.html");
  }
}

/* ================= CONFIRM ADDRESS ================= */

const confirmAddressButton =
  document.getElementById('confirmAddressButton');

confirmAddressButton.addEventListener('click', function () {

  const street =
    document.getElementById('streetAddress').value.trim();

  const area =
    document.getElementById('colonyArea').value.trim();

  const postal =
    document.getElementById('postalCode').value.trim();

  if (
    !street ||
    !area ||
    selectedCity === 'Select City' ||
    selectedLocality === 'Select Locality' ||
    !postal
  ) {

    alert('Please fill all fields.');

    return;
  }

  const pattern = /^5000(0[1-9]|[1-9][0-9])$/;

  if (!pattern.test(postal)) {

    alert("We don't serve this postal code.");

    return;
  }

  const fullAddress =
    `${street}, ${area}, ${selectedLocality}, ${selectedCity}, ${postal}`;

  localStorage.setItem('address', fullAddress);

  window.location.replace("1confirm.html");
});

  window.location.replace("1confirm.html");
